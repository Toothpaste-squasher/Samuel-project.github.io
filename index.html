<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Rock Paer Scissors</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="mid-container">
        <h1>Rock Paper Scissors</h1>

        <div class="js">
          <button
            id="player-rock"
            class="play"
            onclick="
            playGame('rock');
            "
          >
            <img src="images/rock.png" alt="rock" />
          </button>

          <button
            id="player-paper"
            class="play"
            onclick="
            playGame('paper');
            "
          >
            <img src="images/paper.png" alt="paper" />
          </button>

          <button
            id="player-scissors"
            class="play"
            onclick="
            playGame('scissors');
            "
          >
            <img src="images/scissors.png" alt="scissors" />
          </button>
        </div>
        <input
          type="text"
          class="js-input"
          id="celebrationInput"
          placeholder="Enter letters, numbers or emojis"
        />
        <div class="js-result"></div>
        <div class="js-score"></div>

        <button
          class="js-reset"
          onclick="
            score.player = 0;
            score.computer = 0;
            localStorage.setItem('score', JSON.stringify(score));
            document.querySelector('.js-score').innerHTML = `Score: Player ${score.player}; Computer ${score.computer}`;
          "
        >
          Reset score
        </button>
        <button
          class="js-auto-play"
          onclick="
          if (document.querySelector('.js-auto-play').innerHTML.trim() === 'Auto play') {
            isAutoPlaying = true;
            autoPlay();
            document.querySelector('.js-auto-play').innerHTML = 'STOP auto play';
          } else {
            isAutoPlaying = false;
            clearInterval(autoPlayInterval);
            document.querySelector('.js-auto-play').innerHTML = 'Auto play';
          }
          "
        >
          Auto play
        </button>
      </div>

      <div class="player-display character-box">
        <div class="text-bubble">
          <img
            src="images/convo-bubbles/Subject 6.PNG"
            alt="convo-bubble"
            class="player-bubble"
          />
          <p class="dialogue playerDia">Let's goo</p>
        </div>
        <img
          src="images/player.gif"
          alt="player"
          style="height: 100%; width: 100%"
          class="player-character character-gif"
        />
      </div>

      <div class="computer-display character-box">
        <div class="text-bubble">
          <img
            src="images/convo-bubbles/Subject 6.PNG"
            alt="convo-bubble"
            class="comp-bubble"
          />
          <p class="dialogue compDia">Let's play</p>
        </div>
        <div>
          <img
            src="images/robot.gif"
            alt="robot"
            style="height: 100%; width: 100%"
            class="robot-character character-gif"
          />
          <button
            class="askToStop"
            onclick="
              if (document.querySelector('.askToStop').innerHTML.trim() === `STOP dancing you Strabid`) {
                document.querySelector('.robot-character').src = 'images/robot.png';
                document.querySelector('.askToStop').innerHTML = 'Fine you can continue';
              } else if (document.querySelector('.askToStop').innerHTML.trim() === 'Fine you can continue') {
                document.querySelector('.robot-character').src = 'images/robot.gif';
                document.querySelector('.askToStop').innerHTML = 'STOP dancing you Strabid';
              }
            "
          >
            STOP dancing you Strabid
          </button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script src="script.js"></script>
  </body>
</html>
